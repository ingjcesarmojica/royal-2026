services:
  # Backend API
  - type: web
    name: royal-crm-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build --workspace=apps/api
    startCommand: node apps/api/dist/main
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_HOST
        value: ""
      - key: DB_PORT
        value: "5432"
      - key: DB_USERNAME
        value: ""
      - key: DB_PASSWORD
        value: ""
      - key: DB_DATABASE
        value: royal_crm
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://royal-crm-web.onrender.com
      - key: PORT
        value: 3001
    healthCheckPath: /api/docs

  # Frontend Web
  - type: web
    name: royal-crm-web
    runtime: node
    plan: free
    buildCommand: npm install && npm run build --workspace=apps/web
    startCommand: node apps/web/node_modules/.bin/next start apps/web
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://royal-crm-api.onrender.com/api
      - key: PORT
        value: 3000
    healthCheckPath: /

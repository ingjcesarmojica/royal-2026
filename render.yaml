services:
  # Backend API
  - type: web
    name: royal-crm-api
    runtime: image
    plan: free
    image:
      url: https://github.com/ingjcesarmojica/royal-2026.git
      branch: master
      dockerfilePath: Dockerfile.api
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_HOST
        value: ""
      - key: DB_PORT
        value: "5432"
      - key: DB_USERNAME
        value: ""
      - key: DB_PASSWORD
        value: ""
      - key: DB_DATABASE
        value: royal_crm
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://royal-crm-web.onrender.com
      - key: PORT
        value: 3001

  # Frontend Web
  - type: web
    name: royal-crm-web
    runtime: image
    plan: free
    image:
      url: https://github.com/ingjcesarmojica/royal-2026.git
      branch: master
      dockerfilePath: Dockerfile.web
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://royal-crm-api.onrender.com/api
      - key: PORT
        value: 3000

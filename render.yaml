services:
  # Backend API
  - type: web
    name: royal-crm-api
    runtime: node
    plan: free
    buildCommand: cd apps/api && npm install && npm run build
    startCommand: cd apps/api && node dist/main
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 5432
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_DATABASE
        value: royal_crm
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://royal-crm-web.onrender.com
      - key: PORT
        value: 3001
    healthCheckPath: /api/docs

  # Frontend Web
  - type: web
    name: royal-crm-web
    runtime: node
    plan: free
    buildCommand: cd apps/web && npm install && npm run build
    startCommand: cd apps/web && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://royal-crm-api.onrender.com/api
      - key: PORT
        value: 3000
    healthCheckPath: /

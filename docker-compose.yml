version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: royal-crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: royal_crm
      POSTGRES_USER: royal_crm_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-royal_crm_dev_password}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U royal_crm_user -d royal_crm']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: royal-crm-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: royal-crm-mailhog
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  postgres_data:
  redis_data:
